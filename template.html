<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riftbrawl</title>
<style>
  html,body{margin:0;height:100%;background:#0b0810;overflow:hidden;font-family:ui-monospace,Menlo,Consolas,monospace}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;max-width:100vw;max-height:100vh;aspect-ratio:16/9;width:min(100vw,calc(100vh*16/9));height:auto;image-rendering:auto;background:#000;cursor:pointer}
  #join{position:fixed;left:50%;top:52%;transform:translate(-50%,-50%);display:none;gap:10px;align-items:center}
  #join input{font:800 42px ui-monospace,monospace;width:200px;text-align:center;text-transform:uppercase;letter-spacing:10px;padding:8px 10px;border:3px solid #ff4fd8;background:#140f1e;color:#fff;border-radius:6px;outline:none}
  #join button{font:800 20px ui-monospace,monospace;padding:16px 20px;background:#ff4fd8;color:#fff;border:0;border-radius:6px;cursor:pointer}
  #fs{position:fixed;right:10px;bottom:10px;font:700 12px ui-monospace,monospace;background:rgba(255,255,255,.12);color:#ddd;border:0;border-radius:4px;padding:6px 10px;cursor:pointer}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<div id="join"><input id="joincode" maxlength="4" autocomplete="off" spellcheck="false" placeholder="CODE"><button id="joinbtn">JOIN</button></div>

</html>
