<script src="peerjs.min.js"></script>
<script>
// ===== CORE: utils, rng, input, audio =====
const W = 1280, H = 720;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sign = v => v < 0 ? -1 : v > 0 ? 1 : 0;
const rnd = Math.random;
const rr = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rr(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const deg = d => d * Math.PI / 180;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function SRng(seed) {
  const r = mulberry32(seed);
  return {
    f: r,
    r: (a, b) => a + r() * (b - a),
    i: (a, b) => Math.floor(a + r() * (b - a + 1)),
    pick: arr => arr[Math.floor(r() * arr.length)],
    chance: p => r() < p,
  };
}
function shuffle(a, f = Math.random) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function store(key, val) { try { if (val === undefined) return JSON.parse(localStorage.getItem(key)); localStorage.setItem(key, JSON.stringify(val)); } catch (e) { return null; } }

// ===== INPUT =====
// Normalised per-frame input: mx,my (-1..1), held a,b,j,s,m(smash key),p ; pressed ap,bp,jp,sp,pp; cx,cy (c-stick), flick dir
const Keys = {}; const KeysPressed = {};
addEventListener('keydown', e => {
  if (!Keys[e.code]) KeysPressed[e.code] = true;
  Keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) e.preventDefault();
  Audio2.unlock();
});
addEventListener('keyup', e => { Keys[e.code] = false; });
addEventListener('blur', () => { for (const k in Keys) Keys[k] = false; });
addEventListener('mousedown', () => Audio2.unlock());

const KB_LAYOUTS = {
  kb1: { l: ['KeyA'], r: ['KeyD'], u: ['KeyW'], d: ['KeyS'], a: ['KeyJ'], b: ['KeyK'], j: ['Space'], s: ['KeyL', 'ShiftLeft'], m: ['KeyI'], p: ['Escape', 'Enter'] },
  kb2: { l: ['ArrowLeft'], r: ['ArrowRight'], u: ['ArrowUp'], d: ['ArrowDown'], a: ['Comma', 'Numpad1'], b: ['Period', 'Numpad2'], j: ['ShiftRight', 'Numpad0'], s: ['Slash', 'Numpad3'], m: ['Semicolon', 'Numpad4'], p: ['Backspace', 'NumpadEnter'] },
};
// Positional mapping (standard gamepad): 0=bottom(B on Switch) 1=right(A) 2=left(Y) 3=top(X)
// Smash defaults on Pro Controller: A(right)=attack, B(bottom)=special, X/Y=jump, L/R/ZL/ZR=shield
const PAD_DEFAULT = { a: [1], b: [0], j: [2, 3], s: [4, 5, 6, 7], m: [], p: [9], back: [8] };
let padMap = store('sse_padmap') || JSON.parse(JSON.stringify(PAD_DEFAULT));
let gamepadBlocked = false;
function getPads() {
  if (gamepadBlocked || !navigator.getGamepads) return [];
  try { return Array.from(navigator.getGamepads()).filter(Boolean); } catch (e) { gamepadBlocked = true; return []; }
}
addEventListener('gamepadconnected', e => { UI.toast('Controller connected: ' + shortPadName(e.gamepad.id)); Audio2.unlock(); });
addEventListener('gamepaddisconnected', e => UI.toast('Controller disconnected'));
function shortPadName(id) {
  if (/pro controller|057e/i.test(id)) return 'Switch Pro Controller';
  if (/xbox|xinput/i.test(id)) return 'Xbox Controller';
  if (/dualsense|dualshock|054c/i.test(id)) return 'PlayStation Controller';
  return id.split('(')[0].trim().slice(0, 28) || 'Gamepad';
}

class InputSource {
  constructor(dev) { this.dev = dev; this.prev = {}; this.hist = []; this.cur = this.blank(); }
  blank() { return { mx: 0, my: 0, cx: 0, cy: 0, a: 0, b: 0, j: 0, s: 0, m: 0, p: 0, back: 0, ap: 0, bp: 0, jp: 0, sp: 0, mp: 0, pp: 0, backp: 0, flick: 0, flickY: 0, kb: 1 }; }
  poll() {
    const o = this.blank();
    if (this.dev.startsWith('kb')) {
      const L = KB_LAYOUTS[this.dev];
      const any = arr => arr.some(k => Keys[k]);
      o.mx = (any(L.r) ? 1 : 0) - (any(L.l) ? 1 : 0);
      o.my = (any(L.d) ? 1 : 0) - (any(L.u) ? 1 : 0);
      for (const k of ['a', 'b', 'j', 's', 'm', 'p']) o[k] = any(L[k]) ? 1 : 0;
      o.kb = 1;
    } else if (this.dev.startsWith('pad')) {
      const idx = +this.dev.slice(3);
      const pads = getPads(); const gp = pads.find(p => p.index === idx);
      if (gp) {
        const ax = i => (gp.axes[i] || 0);
        let x = ax(0), y = ax(1);
        if (Math.hypot(x, y) < 0.22) { x = 0; y = 0; }
        const btn = i => gp.buttons[i] && (gp.buttons[i].pressed || gp.buttons[i].value > 0.5);
        if (btn(14)) x = -1; if (btn(15)) x = 1; if (btn(12)) y = -1; if (btn(13)) y = 1;
        o.mx = x; o.my = y;
        let cx = ax(2), cy = ax(3); if (Math.hypot(cx, cy) < 0.45) { cx = 0; cy = 0; }
        o.cx = cx; o.cy = cy;
        for (const k of ['a', 'b', 'j', 's', 'm', 'p', 'back']) o[k] = (padMap[k] || []).some(btn) ? 1 : 0;
        o.kb = 0;
      }
    }
    for (const k of ['a', 'b', 'j', 's', 'm', 'p', 'back']) o[k + 'p'] = o[k] && !this.prev[k] ? 1 : 0;
    // c-stick edge
    const cmag = Math.hypot(o.cx, o.cy), pc = Math.hypot(this.prev.cx || 0, this.prev.cy || 0);
    o.cp = cmag > 0.6 && pc <= 0.6 ? 1 : 0;
    // flick detection (smash input)
    this.hist.push([o.mx, o.my]); if (this.hist.length > 5) this.hist.shift();
    if (!o.kb) {
      const old = this.hist[0];
      if (Math.abs(o.mx) > 0.8 && Math.abs(old[0]) < 0.35) o.flick = sign(o.mx);
      if (Math.abs(o.my) > 0.8 && Math.abs(old[1]) < 0.35) o.flickY = sign(o.my);
    } else {
      // keyboard: pressing a direction this frame counts as a flick (dash), smash via smash key
      if (o.mx && !this.prev.mx) o.flick = sign(o.mx);
      if (o.my && !this.prev.my) o.flickY = sign(o.my);
    }
    this.prev = o; this.cur = o;
    return o;
  }
}
// Wire format for remote input (compact) — includes press counters so quick taps aren't lost
function packInput(src, counters) {
  const o = src.cur;
  for (const k of ['a', 'b', 'j', 's', 'm', 'p', 'c']) if ((k === 'c' ? o.cp : o[k + 'p'])) counters[k] = (counters[k] + 1) % 1000;
  return [Math.round(o.mx * 100), Math.round(o.my * 100), Math.round(o.cx * 100), Math.round(o.cy * 100),
  (o.a ? 1 : 0) | (o.b ? 2 : 0) | (o.j ? 4 : 0) | (o.s ? 8 : 0) | (o.m ? 16 : 0) | (o.p ? 32 : 0) | (o.kb ? 64 : 0),
  counters.a, counters.b, counters.j, counters.s, counters.m, counters.p, counters.c, o.flick, o.flickY];
}
class RemoteInput {
  constructor() { this.last = null; this.cur = new InputSource('none').blank(); this.pend = { a: 0, b: 0, j: 0, s: 0, m: 0, p: 0, c: 0, flick: 0, flickY: 0 }; }
  feed(arr) {
    if (!Array.isArray(arr) || arr.length < 15) return;
    const keys = ['a', 'b', 'j', 's', 'm', 'p', 'c'];
    if (this.last) keys.forEach((k, i) => { if (arr[5 + i] !== this.last[5 + i]) this.pend[k] = 1; });
    if (arr[12]) this.pend.flick = arr[12]; if (arr[13]) this.pend.flickY = arr[13];
    this.last = arr;
  }
  poll() {
    const o = new InputSource('none').blank(); const a = this.last;
    if (a) {
      o.mx = clamp(a[0] / 100, -1, 1); o.my = clamp(a[1] / 100, -1, 1); o.cx = clamp(a[2] / 100, -1, 1); o.cy = clamp(a[3] / 100, -1, 1);
      const f = a[4] | 0; o.a = f & 1; o.b = (f >> 1) & 1; o.j = (f >> 2) & 1; o.s = (f >> 3) & 1; o.m = (f >> 4) & 1; o.p = (f >> 5) & 1; o.kb = (f >> 6) & 1;
    }
    for (const k of ['a', 'b', 'j', 's', 'm', 'p']) { o[k + 'p'] = this.pend[k]; this.pend[k] = 0; }
    o.cp = this.pend.c; this.pend.c = 0;
    o.flick = this.pend.flick; o.flickY = this.pend.flickY; this.pend.flick = 0; this.pend.flickY = 0;
    this.cur = o; return o;
  }
}

// ===== AUDIO (synth) =====
const Audio2 = {
  ctx: null, vol: 0.5, muted: store('sse_muted') || false,
  unlock() { if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => { }); return; } try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); this.master = this.ctx.createGain(); this.master.gain.value = this.vol; this.master.connect(this.ctx.destination); } catch (e) { } },
  tone(freq, dur, type = 'square', vol = 0.2, slide = 0) {
    if (!this.ctx || this.muted) return; const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain(); o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur);
  },
  noise(dur, vol = 0.3, freq = 1200) {
    if (!this.ctx || this.muted) return; const t = this.ctx.currentTime; const n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate); const d = buf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = this.ctx.createBufferSource(); s.buffer = buf; const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
    const g = this.ctx.createGain(); g.gain.value = vol; s.connect(f); f.connect(g); g.connect(this.master); s.start(t);
  },
  play(name, k = 1) {
    switch (name) {
      case 'hit': this.noise(0.08 + k * 0.04, 0.25 + k * 0.1, 900 + k * 900); this.tone(180 - k * 30, 0.1, 'square', 0.12, 0.5); break;
      case 'bighit': this.noise(0.25, 0.45, 2500); this.tone(110, 0.3, 'sawtooth', 0.2, 0.3); break;
      case 'swing': this.noise(0.06, 0.08, 3000); break;
      case 'jump': this.tone(300, 0.08, 'square', 0.07, 1.8); break;
      case 'land': this.noise(0.05, 0.08, 500); break;
      case 'shield': this.tone(600, 0.08, 'triangle', 0.15, 1.2); break;
      case 'ko': this.noise(0.6, 0.5, 4000); this.tone(800, 0.6, 'sawtooth', 0.2, 0.1); break;
      case 'blip': this.tone(660, 0.05, 'square', 0.08); break;
      case 'select': this.tone(520, 0.06, 'square', 0.1); setTimeout(() => this.tone(780, 0.08, 'square', 0.1), 60); break;
      case 'shoot': this.tone(900, 0.1, 'triangle', 0.1, 0.4); break;
      case 'boom': this.noise(0.4, 0.5, 700); this.tone(70, 0.4, 'sine', 0.3, 0.4); break;
      case 'portal': this.tone(200, 0.4, 'sine', 0.12, 3); break;
      case 'clink': this.tone(1400, 0.06, 'square', 0.1, 0.7); break;
      case 'boon': [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.tone(f, 0.12, 'triangle', 0.12), i * 70)); break;
      case 'lock': this.tone(150, 0.3, 'sawtooth', 0.15, 0.6); break;
      case 'heal': this.tone(500, 0.2, 'sine', 0.15, 2); break;
      case 'charge': this.tone(200 + k * 400, 0.04, 'sine', 0.05); break;
    }
  }
};

// ===== FIGHTERS: poses + movesets =====
// Pose: [hipX, hipY, lean, h1x,h1y, h2x,h2y, f1x,f1y, f2x,f2y, weaponDeg]
// hands relative to shoulder, feet relative to hip, all in facing space (+x forward, +y down)
const STAND = [0, -25, 0.05, 5, 19, -4, 19, 5, 25, -5, 25, 70];
const P = (...a) => a;
const POSE = {
  stand: STAND,
  crouch: P(0, -15, 0.35, 10, 12, 0, 14, 12, 16, -10, 16, 40),
  jump: P(0, -28, 0.0, 10, 8, -10, 6, 8, 16, -6, 20, 30),
  fall: P(0, -26, -0.05, 12, -6, -12, -4, 6, 22, -8, 18, 20),
  helpless: P(0, -26, -0.2, 14, -14, -14, -12, 10, 18, -10, 20, -60),
  hurt: P(-3, -26, -0.45, -16, -8, -10, -14, 10, 20, -8, 24, -40),
  tumble: P(0, -26, 1.2, -18, -2, 16, 8, 14, 14, -14, 18, 160),
  shield: P(0, -22, 0.15, 12, 6, 8, 10, 8, 22, -8, 22, 10),
  ledge: P(-6, -26, 0.15, 14, -6, 10, -6, 2, 24, -4, 22, -80),
  dead: P(0, -10, 1.5, 10, 10, -10, 10, 10, 10, -10, 10, 90),
  dodge: P(-2, -24, 0.4, 2, 14, -6, 14, 2, 22, -8, 18, 60),
};
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
function kfPose(kf, f) {
  if (f <= kf[0][0]) return kf[0][1];
  for (let i = 0; i < kf.length - 1; i++) {
    const [fa, pa] = kf[i], [fb, pb] = kf[i + 1];
    if (f <= fb) { let t = (f - fa) / Math.max(1, fb - fa); t = t * t * (3 - 2 * t); return mix(pa, pb, t); }
  }
  return kf[kf.length - 1][1];
}
// hb: [start,end, x,y, r, dmg, angle, bkb, kbg, opts]
function HB(s, e, x, y, r, d, a, bkb, kbg, o = {}) { return { s, e, x, y, r, d, a, bkb, kbg, ...o }; }

function baseMoves() {
  const S = STAND;
  return {
    jab1: { d: 14, kf: [[0, S], [3, P(2, -25, 0.12, 22, -2, -6, 12, 7, 25, -7, 25, 0)], [8, P(2, -25, 0.12, 22, -2, -6, 12, 7, 25, -7, 25, 0)], [14, S]], hb: [HB(3, 5, 24, -46, 9, 3, 30, 14, 25)], jab: 1 },
    jab2: { d: 14, kf: [[0, S], [3, P(3, -25, 0.15, 4, 10, 22, 0, 7, 25, -7, 25, 30)], [8, P(3, -25, 0.15, 4, 10, 22, 0, 7, 25, -7, 25, 30)], [14, S]], hb: [HB(3, 5, 25, -44, 9, 3, 35, 16, 25)], jab: 2 },
    jab3: { d: 26, kf: [[0, S], [4, P(-2, -26, -0.15, -8, 8, -10, 10, 26, -12, -6, 25, 90)], [10, P(-2, -26, -0.15, -8, 8, -10, 10, 26, -12, -6, 25, 90)], [26, S]], hb: [HB(4, 7, 30, -36, 13, 5, 40, 45, 90)] },
    ftilt: { d: 26, kf: [[0, S], [6, P(-4, -26, -0.3, -10, 8, -12, 4, 30, -4, -4, 25, 100)], [12, P(-4, -26, -0.3, -10, 8, -12, 4, 30, -4, -4, 25, 100)], [26, S]], hb: [HB(6, 9, 34, -28, 12, 9, 35, 30, 95)] },
    utilt: { d: 24, kf: [[0, S], [4, P(0, -25, 0.1, 16, 2, -6, 12, 6, 25, -6, 25, 20)], [7, P(0, -26, -0.05, 2, -24, -6, 10, 6, 25, -6, 25, -90)], [11, P(0, -26, -0.15, -12, -16, -6, 10, 6, 25, -6, 25, -150)], [24, S]], hb: [HB(5, 10, 6, -66, 16, 7, 90, 32, 110)] },
    dtilt: { d: 18, kf: [[0, POSE.crouch], [4, P(0, -13, 0.45, 10, 14, -6, 12, 30, 12, -12, 14, 10)], [9, P(0, -13, 0.45, 10, 14, -6, 12, 30, 12, -12, 14, 10)], [18, POSE.crouch]], hb: [HB(4, 7, 32, -6, 11, 6, 75, 30, 70)], crouchEnd: 1 },
    dash: { d: 32, kf: [[0, S], [5, P(6, -30, 0.2, 10, -4, -12, 4, 24, 4, -10, 20, 0)], [16, P(6, -30, 0.2, 10, -4, -12, 4, 24, 4, -10, 20, 0)], [32, S]], hb: [HB(5, 9, 26, -32, 14, 10, 50, 50, 70), HB(10, 15, 24, -32, 12, 6, 50, 40, 60)], dash: 1 },
    fsmash: { d: 44, charge: 8, kf: [[0, S], [8, P(-4, -24, -0.25, -16, 4, 8, 6, 12, 25, -12, 25, -120)], [14, P(6, -24, 0.4, 30, -2, -14, 8, 18, 25, -16, 25, 0)], [24, P(6, -24, 0.4, 30, -2, -14, 8, 18, 25, -16, 25, 0)], [44, S]], hb: [HB(13, 17, 38, -44, 15, 16, 38, 40, 100)], smash: 1 },
    usmash: { d: 42, charge: 6, kf: [[0, S], [6, P(0, -17, 0.3, 8, 14, -8, 14, 12, 16, -12, 16, 60)], [12, P(0, -30, -0.05, 2, -26, -2, -26, 4, 28, -4, 28, -90)], [22, P(0, -30, -0.05, 2, -26, -2, -26, 4, 28, -4, 28, -90)], [42, S]], hb: [HB(11, 16, 0, -78, 18, 15, 90, 36, 100)], smash: 1 },
    dsmash: { d: 42, charge: 6, kf: [[0, S], [6, P(0, -18, 0.1, 10, 12, -10, 12, 6, 18, -6, 18, 80)], [12, P(0, -11, 0.0, 16, 12, -16, 12, 30, 10, -30, 10, 0)], [22, P(0, -11, 0.0, 16, 12, -16, 12, 30, 10, -30, 10, 180)], [42, S]], hb: [HB(11, 14, 32, -6, 13, 13, 25, 35, 95), HB(14, 17, -32, -6, 13, 12, 155, 35, 95)], smash: 1 },
    nair: { d: 30, air: 1, lag: 8, kf: [[0, POSE.jump], [4, P(0, -26, 0.0, 18, -6, -18, -6, 18, 4, -18, 4, 0)], [20, P(0, -26, 0.0, 18, -6, -18, -6, 18, 4, -18, 4, 360)], [30, POSE.jump]], hb: [HB(4, 8, 0, -30, 24, 10, 45, 30, 90), HB(9, 20, 0, -30, 22, 6, 45, 20, 70)] },
    fair: { d: 34, air: 1, lag: 12, kf: [[0, POSE.jump], [6, P(0, -26, -0.3, -4, -24, -10, -16, 12, 12, -10, 18, -110)], [11, P(0, -26, 0.4, 26, 8, 10, 10, 10, 16, -14, 16, 60)], [20, P(0, -26, 0.4, 26, 8, 10, 10, 10, 16, -14, 16, 60)], [34, POSE.jump]], hb: [HB(8, 12, 28, -34, 15, 12, 40, 32, 95)] },

const HB_SCALE = 1.35; // generous player hitboxes
for (const F of FIGHTERS) {
  const base = baseMoves(); const m = F.mul; F.moves = {};
  for (const [k, mv] of Object.entries(base)) {
    const nm = { ...mv, name: k };
    nm.d = Math.round(mv.d * m.spd);
    const sc = m.spd; nm.kf = mv.kf.map(([f, p]) => [Math.round(f * sc), p]);
    if (mv.charge) nm.charge = Math.round(mv.charge * sc);
    nm.hb = mv.hb.map(h => ({ ...h, s: Math.round(h.s * sc), e: Math.max(Math.round(h.s * sc) + 1, Math.round(h.e * sc)), x: h.x * m.reach, y: h.y, r: h.r * m.rad * (F.weapon === 'none' ? 1 : 1.08) * HB_SCALE, d: Math.round(h.d * m.dmg), bkb: h.bkb, kbg: h.kbg * m.kb }));
    F.moves[k] = nm;
  }
  // Signature tweaks
  if (F.id === 1) { F.moves.dair.hb[0].a = -90; F.moves.utilt.hb[0].r *= 1.2; F.moves.fsmash.hb[0].d = 17; }

  for (const [k, mv] of Object.entries(F.specials)) F.moves[k] = { ...mv, name: k, hb: (mv.hb || []).map(h => ({ ...h, r: h.r * HB_SCALE })), special: 1 };
}

function drawTitleBG() {

    UI.text(F.name, x + (cw - 20) / 2, y + 230, 30, F.color); UI.text(F.title, x + (cw - 20) / 2, y + 254, 14, '#ccc');
    UI.wrap(F.blurb, x + 14, y + 282, cw - 48, 12, '#ddd');
    const sp = F.specials; [['N', 'nspec'], ['S', 'sspec'], ['U', 'uspec'], ['D', 'dspec']].forEach(([k, m], j) => UI.text(k + '-B  ' + sp[m].name, x + 14, y + 340 + j * 18, 12, '#ffde3c', 'left', 700));

function drawBoon() {

function drawMenu(title, opts, idx, y0 = 300) {
  opts.forEach((o, i) => { const y = y0 + i * 52; const sel = i === idx; ctx.fillStyle = sel ? '#ff4fd8' : 'rgba(20,16,28,0.85)'; ctx.fillRect(W / 2 - 220, y - 30, 440, 44); UI.text(o, W / 2, y, 22, sel ? '#fff' : '#ddd'); clickRegions().push({ x: W / 2 - 220, y: y - 30, w: 440, h: 44, fn: () => { Game.clickPick = i; } }); });
}
function sceneDraw() {
  const G = Game; Game.clicks = [];
  const sc = Net.isGuest ? Net.guestScene : G.scene;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
  switch (sc) {
    case 'title': drawTitleBG(); UI.text('RIFTBRAWL', W / 2, 200, 96, '#fff'); UI.text('a co-op roguelike platform fighter', W / 2, 245, 22, '#ff4fd8');
      if (G.t % 60 < 40) UI.text('PRESS ANY BUTTON', W / 2, 380, 26, '#ffde3c'); UI.text(gamepadBlocked ? 'Controllers unavailable in this view — open the page full-screen to use one' : (getPads().length ? 'Controller detected: ' + shortPadName(getPads()[0].id) : 'Keyboard ready · Plug in a controller and press a button'), W / 2, 430, 15, '#aaa');
      if (G.best.time) UI.text('Best clear ' + fmtTime(G.best.time) + (G.best.endless ? ' · Endless best ' + G.best.endless : ''), W / 2, 470, 14, '#888');

    case 'remap': { drawTitleBG(); const R = G.remap; UI.text('CONTROLLER SETUP', W / 2, 160, 40, '#fff'); if (!getPads().length) UI.text('No controller detected. Connect one and press a button first.', W / 2, 300, 18, '#ffde3c'); else { UI.text('Press the button you want for:', W / 2, 280, 20, '#ccc'); UI.text(REMAP_STEPS[Math.min(R.step, REMAP_STEPS.length - 1)][1], W / 2, 350, 54, '#ff4fd8'); UI.text('Smash default: ATTACK = A (right), SPECIAL = B (bottom), JUMP = X, SHIELD = R', W / 2, 430, 15, '#aaa'); UI.text('Esc: cancel   Backspace: reset to default', W / 2, 470, 14, '#888'); } break; }
    case 'lobby': drawTitleBG(); UI.text('HOSTING ONLINE CO-OP', W / 2, 170, 36, '#fff'); UI.text('Share this room code with your partner:', W / 2, 250, 20, '#ccc'); UI.text(Net.code || '....', W / 2, 340, 90, '#ffde3c'); UI.text(Net.status, W / 2, 410, 17, Net.ok ? '#7dff8a' : '#ff8a8a'); UI.text('They open this same game, pick ONLINE: JOIN, and enter the code.', W / 2, 450, 15, '#aaa'); UI.text('SPECIAL / Esc to go back', W / 2, 620, 14, '#888'); break;
    case 'join': drawTitleBG(); UI.text('JOIN ONLINE CO-OP', W / 2, 170, 36, '#fff'); UI.text('Type the host\'s 4-letter code below, then press Enter', W / 2, 240, 18, '#ccc'); UI.text(Net.status, W / 2, 440, 17, Net.ok ? '#7dff8a' : '#ffde3c'); break;
    case 'charsel': drawCharSel(); break;

    case 'boon': drawBoon(); break;
    case 'over': { drawTitleBG(); const s = G.overStats || {}; UI.text(s.win ? 'VICTORY' : 'DEFEATED', W / 2, 170, 72, s.win ? '#ffde3c' : '#ff4f6a'); UI.text(s.stage || '', W / 2, 230, 22, '#fff'); UI.text('Time ' + fmtTime(s.time || 0) + '   ·   KOs ' + (s.kills || 0) + (s.endless ? '   ·   Endless stages ' + s.endless : ''), W / 2, 280, 20, '#ccc'); if (G.t > 40) UI.text('ATTACK: new run   ·   SPECIAL: title', W / 2, 400, 20, '#ffde3c'); clickRegions().push({ x: 0, y: 0, w: W, h: H, fn: () => { Game.clickPick = 0; } }); break; }
    case 'victory': { drawWorld(); ctx.fillStyle = 'rgba(10,8,16,0.8)'; ctx.fillRect(0, 0, W, H); UI.text('THE HOLLOW CROWN FALLS', W / 2, 170, 48, '#ffde3c'); UI.text('Run time ' + fmtTime(G.run ? G.run.time : 0), W / 2, 220, 20, '#fff'); UI.text('The rift is still open… how far can you go?', W / 2, 260, 18, '#ff4fd8'); drawMenu('', ['ENTER ENDLESS MODE', 'END RUN (VICTORY)'], G.menuIdx, 360); break; }

}
function drawPause(local) { ctx.fillStyle = 'rgba(10,8,16,0.75)'; ctx.fillRect(0, 0, W, H); UI.text(Net.isGuest && Net.hostPaused && !local ? 'PAUSED BY HOST' : 'PAUSED', W / 2, 200, 56, '#fff'); if (!Net.isGuest) drawMenu('', ['RESUME', 'SHOW CONTROLS', 'QUIT RUN'], Game.pauseIdx, 320); else if (local) drawMenu('', ['RESUME', 'LEAVE GAME'], Game.pauseIdx, 320); }
function fmtTime(f) { const s = Math.floor(f / 60); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }

// ---- join box (DOM) ----
const joinBox = document.getElementById('join');
const joinInput = document.getElementById('joincode');
function showJoinBox(v) { joinBox.style.display = v ? 'flex' : 'none'; if (v) setTimeout(() => joinInput.focus(), 50); }
function joinFocused() { return document.activeElement === joinInput; }
joinInput.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') { const code = joinInput.value.trim().toUpperCase(); if (/^[A-Z]{4}$/.test(code)) { Net.join(code); } else Net.status = 'Codes are 4 letters'; } if (e.key === 'Escape') { showJoinBox(false); Game.setScene('mode'); } });
document.getElementById('joinbtn').addEventListener('click', () => { const code = joinInput.value.trim().toUpperCase(); if (/^[A-Z]{4}$/.test(code)) Net.join(code); else Net.status = 'Codes are 4 letters'; });

// ---- mouse clicks (menus) ----
cv.addEventListener('click', ev => {
  Audio2.unlock();
  const r = cv.getBoundingClientRect(); const x = (ev.clientX - r.left) / r.width * W, y = (ev.clientY - r.top) / r.height * H;
  const regs = (Game.clicks || []).slice().reverse(); for (const c of regs) if (x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h) { c.fn(); break; }
});

// ---- main loop ----
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  let steps = 0;
  while (acc >= 1000 / 60 && steps < 4) {
    Devices.pollAll(); if (Net.remote) Net.remote.poll();
    sceneUpdate();
    if (!Net.isGuest && Game.scene === 'play') Game.updateCamera();
    Net.tick();
    for (const k in KeysPressed) delete KeysPressed[k];
    acc -= 1000 / 60; steps++;
  }
  sceneDraw();
  requestAnimationFrame(loop);
}

document.getElementById('fs').addEventListener('click',()=>{const el=document.documentElement;try{(el.requestFullscreen||el.webkitRequestFullscreen).call(el).catch(()=>{});}catch(e){}});
requestAnimationFrame(loop);
</script>
